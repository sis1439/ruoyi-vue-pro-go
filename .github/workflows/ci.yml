name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'   # 固定工具链版本，避免 CI 与本地结果漂移
          cache: true

      - name: Generate DAO code
        run: make gen           # internal/repo/query 未入库，必须先生成

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  # 集成测试需要真实 PostgreSQL 与 Redis。
  # Executes real database, transaction, tenant and Redis tests; skips fail acceptance.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yudao_mall_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:8.2.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/yudao_mall_test?sslmode=disable
      T09_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: make gen
      - run: make test-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: integration-results.jsonl
